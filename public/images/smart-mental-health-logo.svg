      <stop offset="0" stop-color="#75a7ed"/>
      <stop offset="1" stop-color="#3f82de"/>
    </linearGradient>
    <linearGradient id="brainRight" x1="628" y1="145" x2="932" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ad69d"/>
      <stop offset="1" stop-color="#38bea6"/>
    </linearGradient>
    <linearGradient id="tealBlue" x1="200" y1="340" x2="1008" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39c4c5"/>
      <stop offset="0.55" stop-color="#4d91e8"/>
      <stop offset="1" stop-color="#38c8a6"/>
    </linearGradient>
    <linearGradient id="wordMental" x1="210" y1="758" x2="1035" y2="840" gradientUnits="userSpaceOnUse">
