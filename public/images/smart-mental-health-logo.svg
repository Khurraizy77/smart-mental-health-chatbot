      <path d="M21 65c7-41 28-51 48-26 20-25 41-15 48 26" fill="none" stroke="#6d93df" stroke-width="12" stroke-linecap="round"/>
      <path d="M54 17c0 25 30 25 30 0" fill="none" stroke="#6d93df" stroke-width="10" stroke-linecap="round"/>
      <path d="M48 52c12 18 30 18 42 0" fill="none" stroke="#6d93df" stroke-width="9" stroke-linecap="round"/>
